<script src="/scrollcraft.js"></script>
<script>
  ScrollCraft.mount(document.body);
  // photos start under the menu bar, whatever its height (50–75px), so no head sits behind it
  (function () { var bar = document.querySelector('.bar'), set = function () { document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px'); }; set(); if (window.ResizeObserver) new ResizeObserver(set).observe(bar); })();
  // the menu button on a phone
  (function () {
    var btn = document.querySelector('.menu-btn');
    btn.addEventListener('click', function () { var o = document.body.classList.toggle('nav-open'); btn.setAttribute('aria-expanded', o); });
    document.querySelectorAll('.nav a').forEach(function (a) { a.addEventListener('click', function () { document.body.classList.remove('nav-open'); btn.setAttribute('aria-expanded', 'false'); }); });
  })();
</script>
